name: Supply chain

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  dependencies:
    name: Vulnerabilities and available lock updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install the reviewed, hashed dependency set
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Audit the locked dependency graph
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements/ci.txt
      - name: Detect available dependency updates
        run: |
          # Same resolution floor as the committed lock (see ci.yml), otherwise
          # this comparison reports drift that does not exist.
          uv pip compile pyproject.toml \
            --extra dev --extra calibration --extra release --extra supply-chain \
            --extra mcp \
            --universal --python-version 3.11 --generate-hashes --no-annotate \
            --no-header --upgrade -o /tmp/ci-updated.txt
          tail -n +3 requirements/ci.txt > /tmp/ci-current.txt
          diff -u /tmp/ci-current.txt /tmp/ci-updated.txt

  upstream-drift:
    name: Upstream spec, error, and schema drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out the conformance suite
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          path: suite
      - name: Check out current x402 upstream
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          repository: x402-foundation/x402
          ref: main
          path: upstream-x402
          # Full history: the cadence check counts commits since the reviewed pin and
          # diffs specs/ against it. A shallow clone has neither.
          fetch-depth: 0
      - name: Alert when the reviewed matrix is past its cadence
        # Deliberately NOT "fail whenever upstream moved". Upstream moves most days, so
        # that version was red on almost every scheduled run — and a job that is always
        # red is a job nobody reads, which is worse than no job. This fails on the thing
        # the support matrix actually commits to: a review at most two weeks old. Drift
        # inside the window is reported and passes.
        run: |
          set -o pipefail
          reviewed="$(tr -d '\n\r' < suite/.github/upstream-reviewed-commit)"
          current="$(git -C upstream-x402 rev-parse --short=7 HEAD)"
          if [ "$current" = "$reviewed" ]; then
            echo "x402 upstream is at the reviewed pin ($reviewed)."
            exit 0
          fi

          review_line="$(grep -m1 'Latest upstream review' suite/docs/support-matrix.md)"
          review_date="$(printf '%s' "$review_line" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)"
          if [ -z "$review_date" ]; then
            echo "Could not read the review date from docs/support-matrix.md."
            echo "That line is the cadence's source of truth; fix it before trusting this job."
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$review_date" +%s) ) / 86400 ))
          behind="$(git -C upstream-x402 rev-list --count "$reviewed"..HEAD)"
          spec_changes="$(git -C upstream-x402 diff --name-only "$reviewed"..HEAD -- specs/ | wc -l)"

          echo "reviewed=$reviewed ($review_date, ${age}d ago) current=$current"
          echo "commits since the pin: $behind, of which touch specs/: $spec_changes"

          if [ "$age" -le 14 ]; then
            echo "Within the two-week cadence — no action required yet."
            exit 0
          fi
          echo "::error::Upstream review is ${age} days old; the support matrix commits to at most 14."
          echo "Read the commits, update docs/support-matrix.md, then move the pin."
          echo "Spec changes are the priority: in August 2026 a CORE §6 rewrite turned two of"
          echo "our own checks into false positives that failed conformant endpoints."
          exit 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: suite/requirements/ci.txt
      - name: Install the reviewed, hashed test environment
        working-directory: suite
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Compare error registry and validate local wire/report schemas
        working-directory: suite
        # One clone root drives both drift guards: the frozen legacy `ErrorReasons`
        # enum and the generated per-mechanism registry. The enum alone is not
        # enough — upstream stopped extending it, so a guard watching only that
        # file stays green while the codes we accept fall behind the codes real
        # facilitators return.
        env:
          X402_UPSTREAM: ../upstream-x402
        run: >-
          python -m pytest -q
          tests/test_error_reason_drift.py
          tests/test_models.py
          tests/test_report.py
